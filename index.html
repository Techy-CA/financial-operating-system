<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>FinOS — Financial OS</title>

  <!-- Favicon: F monogram -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231D4ED8'/%3E%3Cpath d='M22 18 C22 18 72 18 82 18 C88 18 91 24 82 33 C73 42 35 52 35 52 C35 52 66 52 74 52 C79 52 82 57 74 65 C66 73 35 88 35 88 L35 85' stroke='white' stroke-width='14' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="src/styles/variables.css" />
  <link rel="stylesheet" href="src/styles/reset.css" />
  <link rel="stylesheet" href="src/styles/layout.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <link rel="stylesheet" href="src/styles/pos.css" />
  <link rel="stylesheet" href="src/styles/modules.css" />
  <link rel="stylesheet" href="src/styles/utilities.css" />
  <link rel="stylesheet" href="src/styles/print.css" />
  <link rel="stylesheet" href="src/styles/responsive.css" />

  <style>
    body { background:#F4F6FA; }
    #boot-screen { min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F6FA; }
    .boot-card { background:white;border:1px solid #E2E8F0;border-radius:14px;padding:40px;max-width:400px;width:calc(100% - 40px);text-align:center;box-shadow:0 2px 16px rgba(0,0,0,0.06);margin:20px; }
    .spinner { width:32px;height:32px;border:3px solid #E2E8F0;border-top-color:#1D4ED8;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px; }
    .err-box { background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:12px 14px;font-size:12.5px;color:#991B1B;text-align:left;margin-top:12px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

<div id="app" style="display:none;height:100vh;">
  <div id="auth-container" class="d-none"></div>
  <div id="app-shell" class="app-shell d-none">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="Topbar.toggleMenu()"></div>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <main class="page-content" id="page-content"></main>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container" aria-live="polite"></div>

<div id="boot-screen">
  <div class="boot-card">
    <div style="width:40px;height:40px;background:linear-gradient(135deg,#3B82F6,#1D4ED8);border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 3px 12px rgba(29,78,216,0.3);">
      <svg width="22" height="22" viewBox="0 0 100 120" fill="none"><path d="M15 10 C15 10 70 10 85 10 C90 10 95 15 85 25 C75 35 30 50 30 50 C30 50 70 50 80 50 C85 50 88 55 80 63 C72 71 30 90 30 90 L30 115" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </div>
    <div id="boot-loading">
      <div class="spinner"></div>
      <p style="color:#64748B;font-size:13px;font-family:Inter,sans-serif;">Starting FinOS…</p>
    </div>
    <div id="boot-error" style="display:none;">
      <p style="font-size:16px;font-weight:700;color:#0F172A;margin-bottom:6px;font-family:Inter,sans-serif;">Failed to start</p>
      <div class="err-box" id="err-msg"></div>
      <p style="font-size:12px;color:#64748B;margin-top:10px;font-family:Inter,sans-serif;">Press F12 → Console for details</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<script type="module">
  const firebaseConfig = {
    apiKey:            "AIzaSyCuJZ6enu91CWaJFKQ7lbFGb2nBpf_KSPo",
    authDomain:        "finos-543d9.firebaseapp.com",
    projectId:         "finos-543d9",
    storageBucket:     "finos-543d9.firebasestorage.app",
    messagingSenderId: "740672028290",
    appId:             "1:740672028290:web:a7fd891ad0f2bd7672be9b",
  };

  async function loadEmailJS() {
    return new Promise((resolve) => {
      if (window.emailjs) { resolve(); return; }
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js';
      s.onload = () => {
        window.emailjs.init('C_7lgSun6Nos8Asgr');
        console.log('[FinOS] EmailJS ready');
        // Expose test helper in console
        window.testEmail = async (to) => {
          const { default: E } = await import('./src/services/email.service.js');
          const r = await E.test(to);
          console.log('Email result:', r);
          return r;
        };
        resolve();
      };
      s.onerror = () => { console.warn('[FinOS] EmailJS CDN failed'); resolve(); };
      document.head.appendChild(s);
    });
  }

  try {
    // Load Firebase + EmailJS in parallel
    const [
      { initializeApp },
      { getAuth },
      firestoreSDK,
      { getStorage },
      { getFunctions },
    ] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js'),
      import('https://www.gstatic.com/firebasejs/10.12.4/firebase-storage.js'),
      import('https://www.gstatic.com/firebasejs/10.12.4/firebase-functions.js'),
    ]);

    // Load EmailJS in parallel (non-blocking)
    loadEmailJS();

    const fbApp       = initializeApp(firebaseConfig);
    window.fbApp      = fbApp;
    window.fbAuth     = getAuth(fbApp);
    window.fbStorage  = getStorage(fbApp);
    window.fbFunctions= getFunctions(fbApp);

    // Offline-first: the counter must keep billing when the line drops.
    // An IndexedDB-backed cache serves reads and queues writes locally, then
    // replays them in order once the connection returns. Multi-tab safe.
    // Falls back to the plain in-memory client where IndexedDB is unavailable
    // (private windows, older browsers) rather than failing to boot.
    const {
      getFirestore, initializeFirestore,
      persistentLocalCache, persistentMultipleTabManager,
    } = firestoreSDK;

    try {
      window.fbDB = initializeFirestore(fbApp, {
        localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }),
      });
      window.__offlineReady = true;
      console.log('[FinOS] Offline cache active — sales queue locally when the network drops');
    } catch (e) {
      window.fbDB = getFirestore(fbApp);
      window.__offlineReady = false;
      console.warn('[FinOS] Offline cache unavailable:', e.message);
    }

    document.getElementById('boot-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';

    const { default: App } = await import('./src/core/app.js');
    App.init();

  } catch(err) {
    console.error('[FinOS]', err);
    document.getElementById('boot-loading').style.display = 'none';
    document.getElementById('boot-error').style.display = 'block';
    document.getElementById('err-msg').textContent = err.message;
  }
</script>
</body>
</html>
